<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Check your email — CVDM</title>

    <!-- CVDM Tab Icon -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2320283a'/%3E%3Ctext x='50' y='69' font-size='58' font-family='Georgia,serif' fill='%23fbfaf5' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --ink: #20283a; --ink-soft: #57607a; --ink-faint: #8b93a8;
            --paper: #eeece3; --card: #fbfaf5; --rule: #dbd7c9;
            --green: #1f6f5c; --green-bg: #dfeee7;
            --font-display: "Lora", serif;
            --font-sans: "IBM Plex Sans", sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--ink);
            min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
        }
        .card {
            width: 400px; background: var(--card); border: 1px solid var(--rule);
            border-radius: 10px; padding: 40px 32px; text-align: center;
        }
        .icon {
            width: 52px; height: 52px; border-radius: 50%; background: var(--green-bg); color: var(--green);
            display: flex; align-items: center; justify-content: center; font-size: 24px; margin: 0 auto 18px;
        }
        h1 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0 0 12px; }
        p { color: var(--ink-soft); font-size: 14px; line-height: 1.6; margin: 0 0 6px; }
        .email { font-weight: 600; color: var(--ink); }
        .back-link { display: inline-block; margin-top: 20px; color: var(--ink-faint); text-decoration: none; font-size: 12px; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">&#9993;</div>
        <h1>Check your email</h1>
        <p>We've sent a verification link to</p>
        <p class="email">{{ email }}</p>
        <p style="margin-top:14px;">Click the link in that email to activate your account and sign in.</p>
        <a class="back-link" href="{% url 'login' %}">&larr; Back to sign in</a>
    </div>
</body>
</html>
