<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Draft — CVDM</title>

    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #222; }
        .page { padding: 30px; max-width: 700px; margin: auto; }

        .back-link { display: inline-block; margin-bottom: 20px; color: #2563eb; text-decoration: none; font-size: 14px; }
        .back-link:hover { text-decoration: underline; }

        .messages { margin-bottom: 16px; }
        .msg { padding: 10px 14px; border-radius: 8px; font-size: 14px; margin-bottom: 8px; }
        .msg-error { background: #fee2e2; color: #991b1b; }

        .card {
            background: white;
            padding: 26px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 600; }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            margin-bottom: 18px;
        }
        textarea { min-height: 200px; resize: vertical; }

        .btn {
            padding: 10px 22px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            background: #2563eb;
            color: white;
        }
        .btn:hover { background: #1d4ed8; }
    </style>
</head>

<body>
<div class="page">
    <a class="back-link" href="{% url 'content_list' %}">&larr; All content</a>

    <h1>New draft</h1>

    {% if messages %}
        <div class="messages">
            {% for message in messages %}
                <div class="msg msg-{{ message.tags }}">{{ message }}</div>
            {% endfor %}
        </div>
    {% endif %}

    <div class="card">
        <form method="post">
            {% csrf_token %}

            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />

            <label for="body">Body</label>
            <textarea id="body" name="body" placeholder="Start writing..."></textarea>

            <button type="submit" class="btn">Create draft</button>
        </form>
    </div>
</div>
</body>
</html>
